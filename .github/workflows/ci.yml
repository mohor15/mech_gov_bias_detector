name: CI

on:
  push:
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type-check (mypy)
        run: mypy src

      - name: Test (pytest, with coverage)
        run: pytest

  docker-smoke:
    runs-on: ubuntu-latest
    needs: lint-type-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f infra/docker/Dockerfile -t gov-platform:ci .

      - name: Run container
        run: docker run -d -p 8000:8000 --name gov-platform-ci gov-platform:ci

      - name: Wait for health check
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/healthz; then exit 0; fi
            sleep 1
          done
          echo "service did not become healthy" && docker logs gov-platform-ci && exit 1

      - name: Stop container
        if: always()
        run: docker rm -f gov-platform-ci
