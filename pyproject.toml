[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gov-platform"
version = "0.1.0"
description = "Domain-agnostic AI Governance Platform (V2) — M0: repository foundation & walking skeleton."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["gov_platform"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern is `param: T = Depends(provider)` —
# the idiomatic, documented usage, not the mutable-default-argument bug B008
# exists to catch. Marking `Depends` immutable tells ruff to allow it instead
# of scattering `# noqa: B008` across every route signature.
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "gov_platform.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
# --cov-fail-under added during the M0 finalization review: coverage was
# reported but nothing failed the build if it regressed. 98 gives a small
# margin below M0's actual ~99% rather than a hair-trigger threshold, while
# still catching a real drop.
addopts = "-ra --strict-markers --cov=gov_platform --cov-report=term-missing --cov-fail-under=98"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/gov_platform"]
branch = true
