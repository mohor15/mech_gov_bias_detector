[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gov-platform"
version = "0.13.0"
description = "Domain-agnostic AI Governance Platform (V2) — M12: Reporting — periodic, document-shaped compliance exports (JSON/CSV)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# M10: dashboard_static/'s HTML/CSS/JS are not .py files, so
# packages.find's discovery above never picks them up -- without this
# declaration they'd be present in an editable (`pip install -e .`) dev
# install (served straight off the source tree) and silently missing from
# a real, non-editable install (`infra/docker/Dockerfile`'s
# `pip install .`), the exact packaging risk docs/milestones/M10.md
# §4.4 names. Verified directly against a real, non-editable install --
# see tests/unit/api/test_dashboard.py.
"gov_platform.api" = ["dashboard_static/*.html", "dashboard_static/*.css", "dashboard_static/*.js"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# legacy_v1/ is the M0-archived, superseded V1 prototype -- preserved
# unmodified for reference (see README.md), never imported by gov_platform,
# never run, and not part of this project's quality gates. CI's lint step
# already scopes explicitly to `ruff check src tests`, but a bare
# `ruff check .` (a pre-commit --all-files run, an editor integration, a
# developer typing the obvious command) has no reason to know that implicit
# convention and will otherwise flag legacy_v1's pre-V2 code style. Excluding
# it here is the single point of truth every invocation reads from, instead
# of every caller needing to remember to pass `src tests` explicitly.
exclude = ["legacy_v1"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["gov_platform", "tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern is `param: T = Depends(provider)` —
# the idiomatic, documented usage, not the mutable-default-argument bug B008
# exists to catch. Marking `Depends` immutable tells ruff to allow it instead
# of scattering `# noqa: B008` across every route signature.
#
# `fastapi.Query` added at M7: ruff's B008 already silently exempts
# `Query(default=None)` for a `str | None`-annotated parameter (e.g.
# `api/admin/population_findings.py`'s `system_id` filter, M6) but not for
# a `datetime | None`-annotated one (`api/admin/metrics.py`'s `since`) --
# the identical idiomatic call, flagged only because of the query
# parameter's type. Same fix, same reasoning, for the same false positive.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "gov_platform.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
# No --cov-fail-under here as of M1 (moved out during the M1 environment
# constraint — see docs/milestones/M1.md). M0's blanket local floor assumed
# everything was locally runnable; a meaningful chunk of M1's code is
# genuinely Postgres-only and cannot execute without a live database this
# sandbox doesn't have. A floor enforced where that code can't run would
# either fail dishonestly or have to be weakened enough to stop meaning
# anything in CI too. The floor now lives in .github/workflows/ci.yml's
# Postgres-enabled job, where the number is actually meaningful; local runs
# still report coverage, just without an enforced gate.
addopts = "-ra --strict-markers --cov=gov_platform --cov-report=term-missing"
testpaths = ["tests"]
# "." (repo root) is required, not just "src": several integration tests do
# `from tests.conftest import requires_postgres`, an absolute import of the
# tests package itself. `python -m pytest` masks this by adding cwd to
# sys.path automatically, but the bare `pytest` console script CI invokes
# does not, so collection fails with "No module named 'tests'" there even
# though a local `python -m pytest` run passes. This is pytest's own
# documented mechanism for adding a directory to sys.path for the test
# session (replacing the old pytest-pythonpath plugin / conftest.py
# sys.path hacks) — not a PYTHONPATH environment-variable workaround.
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["src/gov_platform"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    # Abstract method bodies (Adapter.translate, Policy.evaluate) exist only
    # to document the contract; every concrete subclass overrides them
    # completely and never calls super(), so the `raise` is unreachable by
    # construction, not untested behavior.
    "raise NotImplementedError",
    # Never executes under pytest (modules are imported, not run as scripts);
    # the CLI behavior it guards (`main()`) is tested directly by calling
    # `main(argv)`.
    "if __name__ == .__main__.:",
]
